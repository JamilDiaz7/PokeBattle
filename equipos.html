<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PokéBattle - Equipos</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>

    <nav>

        <h2>⚡ PokéBattle</h2>

        <a href="index.html">Perfiles</a>

        <a href="equipos.html">Equipos</a>

        <a href="batalla.html">Batalla</a>

    </nav>

</header>


<main>

    <section class="hero">

        <h1 id="titulo">
            Mis equipos
        </h1>

        <p>
            Crea tu equipo y agrega hasta 6 Pokémon.
        </p>

    </section>


    <section id="sinPerfil" class="caja">

        <h2>
            No hay un perfil seleccionado
        </h2>

        <a href="index.html">
            Volver a perfiles
        </a>

    </section>


    <section id="contenido">

        <section class="caja">

            <h2>
                Crear equipo
            </h2>

            <form id="formEquipo">

                <input
                    type="text"
                    id="nombreEquipo"
                    placeholder="Nombre del equipo"
                >

                <button type="submit">
                    Crear equipo
                </button>

            </form>

            <p id="errorEquipo"></p>

        </section>


        <section class="caja">

            <h2>
                Buscar Pokémon
            </h2>

            <form id="formPokemon">

                <input
                    type="text"
                    id="buscar"
                    placeholder="Ejemplo: pikachu o 25"
                >

                <button type="submit">
                    Buscar
                </button>

            </form>

            <p id="mensaje"></p>

            <div id="pokemon"></div>

        </section>


        <section class="caja">

            <h2>
                Mis equipos
            </h2>

            <div id="equipos"></div>

        </section>

    </section>

</main>


<footer>

    <p>
        PokéBattle - Proyecto Final
    </p>

</footer>


<script src="js/app.js"></script>

<script src="js/equipos.js"></script>

</body>

</html>
