<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PokéBattle</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>

        <nav>

            <h2>⚡ PokéBattle</h2>

            <a href="index.html">Perfiles</a>

            <a href="equipos.html">Equipos</a>

            <a href="batalla.html">Batalla</a>

        </nav>

    </header>


    <main>

        <section class="hero">

            <h1>PokéBattle</h1>

            <p>
                Crea tu entrenador y prepara tu equipo Pokémon.
            </p>

        </section>


        <section class="caja">

            <h2>Crear perfil</h2>

            <form id="formPerfil">

                <input
                    type="text"
                    id="nombre"
                    placeholder="Nombre del entrenador"
                >

                <button type="submit">
                    Crear perfil
                </button>

            </form>

            <p id="error"></p>

        </section>


        <section class="caja">

            <h2>Perfiles guardados</h2>

            <div id="perfiles"></div>

        </section>

    </main>


    <footer>

        <p>
            PokéBattle - Proyecto Final
        </p>

    </footer>


    <script src="js/app.js"></script>

</body>

</html>
